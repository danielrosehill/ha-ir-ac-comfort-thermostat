# Comfort Thermostat — closed-loop control of the
# IR-only AC around ONE selected room.
# v2: cool/idle cycling with anticipation (v1 stepped the setpoint 1 °C per
# tick — see README § "Why v1 was replaced"). v2.1: gentler bursts.
# v2.2: thresholds as helpers. v2.3 (this file): auto-off.
#
#   Master toggle:  input_boolean.climate_manager      (off = hands-off / vacation)
#   Target room:    input_select.climate_manager_room  (Bedroom / Living Room / Office)
#   Comfort temp:   input_number.climate_manager_target_{bedroom,living_room,office}
#   Auto room:      input_boolean.climate_manager_auto_room — 22:00 → Bedroom,
#                   09:00 → Living Room. Manual picks hold until the next boundary.
#   Phase (internal): input_boolean.climate_manager_cooling — on = COOL, off = IDLE
#
# Every 5 min (and immediately on toggle/room/target change), while the AC is
# assumed ON, with e = room − target and slope = room trend in °C/min:
#   IDLE → COOL  when e ≥ +0.5
#   COOL → IDLE  when e ≤ 0, or the 10-min forecast (e + 10·slope) ≤ +0.2
#                (anticipation: stop before the target, the duct keeps cooling)
#   COOL:  setpoint = target − 1 (target − 2 if e ≥ 1.5);  fan high e ≥ 2 · med e ≥ 1 · else low
#   IDLE:  setpoint = 28 (compressor stays off in cool mode), fan low
# Mode is always forced to cool. Power is a blind IR toggle and HA's on/off is
# only assumed (input_boolean.bedroom_ac_on).
#
# Auto-off (v2.3; switch input_boolean.climate_manager_auto_off):
#   PARK    when IDLE for ≥ park_minutes (30) and e ≤ park_error (−0.5): the room
#           is below target on its own, so power the unit off (toggle) and set
#           input_boolean.climate_manager_parked.
#   RESUME  while parked, when e ≥ start: power on (toggle), clear parked, COOL.
#   Only a park the thermostat made is resumed. If the AC is turned off by
#   hand it stays off; turned on by hand while parked clears the park.
# Each helper write fires bedroom_ac_apply_on_change, which re-sends the full
# mode+temp+fan frame, so frames go out only on phase/fan changes.

input_boolean:
  climate_manager:
    name: Comfort Thermostat
    icon: mdi:thermostat-auto
  climate_manager_auto_room:
    name: Comfort Thermostat — auto room (night bedroom / day living room)
    icon: mdi:calendar-clock
  climate_manager_cooling:
    name: Comfort Thermostat — cooling phase
    icon: mdi:snowflake
  climate_manager_auto_off:
    name: Comfort Thermostat — auto-off when the room is cool on its own
    icon: mdi:power-sleep
  climate_manager_parked:
    name: Comfort Thermostat — AC parked (turned off by the thermostat)
    icon: mdi:sleep

input_select:
  climate_manager_room:
    name: Comfort Thermostat Room
    options: [Bedroom, Living Room, Office]
    icon: mdi:home-thermometer

input_number:
  climate_manager_target_bedroom:
    name: Comfort Target — Bedroom
    min: 17
    max: 28
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:bed
  climate_manager_target_living_room:
    name: Comfort Target — Living Room
    min: 17
    max: 28
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:sofa
  climate_manager_target_office:
    name: Comfort Target — Office
    min: 17
    max: 28
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:desk
  # Tuning knobs (v2.2, 2026-10-21). Read by the tick; changed by the
  # thermostat-tune skill. No `initial:` so tuned values survive restarts.
  climate_manager_tune_start:
    name: Comfort Thermostat tune — start cooling at error ≥
    min: 0.2
    max: 2
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:tune-variant
  climate_manager_tune_stop:
    name: Comfort Thermostat tune — stop cooling at error ≤
    min: -1
    max: 0.5
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:tune-variant
  climate_manager_tune_forecast_stop:
    name: Comfort Thermostat tune — stop when forecast error ≤
    min: -0.5
    max: 1
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:tune-variant
  climate_manager_tune_horizon:
    name: Comfort Thermostat tune — forecast horizon
    min: 0
    max: 30
    step: 1
    mode: box
    unit_of_measurement: "min"
    icon: mdi:tune-variant
  climate_manager_tune_cool_offset:
    name: Comfort Thermostat tune — setpoint below target while cooling
    min: 0
    max: 4
    step: 1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:tune-variant
  climate_manager_tune_boost_error:
    name: Comfort Thermostat tune — boost (bigger offset) at error ≥
    min: 0.5
    max: 4
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:tune-variant
  climate_manager_tune_boost_offset:
    name: Comfort Thermostat tune — boost setpoint below target
    min: 1
    max: 6
    step: 1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:tune-variant
  climate_manager_tune_fan_med:
    name: Comfort Thermostat tune — fan med at error ≥
    min: 0
    max: 4
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:tune-variant
  climate_manager_tune_fan_high:
    name: Comfort Thermostat tune — fan high at error ≥
    min: 0
    max: 5
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:tune-variant
  # Auto-off (v2.3). Kept apart from the tune_* control-law thresholds.
  # No initial: — set them once after the first reload (−0.5 and 30).
  climate_manager_park_error:
    name: Comfort Thermostat — auto-off at error ≤
    min: -3
    max: 0
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:power-sleep
  climate_manager_park_minutes:
    name: Comfort Thermostat — auto-off after idle for
    min: 10
    max: 180
    step: 5
    mode: box
    unit_of_measurement: "min"
    icon: mdi:power-sleep

# Room trend (°C/min) comes from UI Derivative helpers, one per room sensor
# (Settings → Helpers → Derivative sensor; source = the room temperature sensor,
# time window 15 min, time unit minutes, 3 decimals). UI helpers load without a
# restart; a YAML `platform: derivative` sensor needs a full HA restart.
# Replace sensor.REPLACE_*_TREND_SENSOR below with their entity ids.

template:
  - sensor:
      - name: Comfort Thermostat Room Temperature
        unique_id: climate_manager_room_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state: >-
          {% set s = {'Bedroom': 'sensor.REPLACE_BEDROOM_TEMP_SENSOR',
                      'Living Room': 'sensor.REPLACE_LIVING_ROOM_TEMP_SENSOR',
                      'Office': 'sensor.REPLACE_OFFICE_TEMP_SENSOR'}[states('input_select.climate_manager_room')] | default('') %}
          {{ states(s) if s else 'unavailable' }}
        availability: >-
          {% set s = {'Bedroom': 'sensor.REPLACE_BEDROOM_TEMP_SENSOR',
                      'Living Room': 'sensor.REPLACE_LIVING_ROOM_TEMP_SENSOR',
                      'Office': 'sensor.REPLACE_OFFICE_TEMP_SENSOR'}[states('input_select.climate_manager_room')] | default('') %}
          {{ s != '' and states(s) | is_number }}
      - name: Comfort Thermostat Room Trend
        unique_id: climate_manager_room_trend
        unit_of_measurement: "°C/min"
        state: >-
          {% set s = {'Bedroom': 'sensor.REPLACE_BEDROOM_TREND_SENSOR',
                      'Living Room': 'sensor.REPLACE_LIVING_ROOM_TREND_SENSOR',
                      'Office': 'sensor.REPLACE_OFFICE_TREND_SENSOR'}[states('input_select.climate_manager_room')] | default('') %}
          {{ states(s) | float(0) if s else 0 }}
      - name: Comfort Thermostat Target
        unique_id: climate_manager_target
        unit_of_measurement: "°C"
        device_class: temperature
        state: >-
          {{ states('input_number.climate_manager_target_' ~
                    states('input_select.climate_manager_room') | lower | replace(' ', '_')) }}

automation:
  - alias: Comfort Thermostat — tick
    id: climate_manager_tick
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: state
        entity_id: input_boolean.climate_manager
        to: "on"
      - platform: state
        entity_id:
          - input_select.climate_manager_room
          - input_number.climate_manager_target_bedroom
          - input_number.climate_manager_target_living_room
          - input_number.climate_manager_target_office
    condition:
      - condition: state
        entity_id: input_boolean.climate_manager
        state: "on"
      - condition: or
        conditions:
          - condition: state
            entity_id: input_boolean.bedroom_ac_on
            state: "on"
          - condition: state
            entity_id: input_boolean.climate_manager_parked
            state: "on"
    action:
      - variables:
          room_raw: "{{ states('sensor.comfort_thermostat_room_temperature') }}"
          target: "{{ states('sensor.comfort_thermostat_target') | float(22) }}"
          slope: "{{ states('sensor.comfort_thermostat_room_trend') | float(0) }}"
          setpoint: "{{ states('input_number.bedroom_ac_temp') | int(24) }}"
          was_cooling: "{{ is_state('input_boolean.climate_manager_cooling', 'on') }}"
          t_start: "{{ states('input_number.climate_manager_tune_start') | float(0.5) }}"
          t_stop: "{{ states('input_number.climate_manager_tune_stop') | float(0) }}"
          t_forecast_stop: "{{ states('input_number.climate_manager_tune_forecast_stop') | float(0.2) }}"
          t_horizon: "{{ states('input_number.climate_manager_tune_horizon') | float(10) }}"
          t_cool_offset: "{{ states('input_number.climate_manager_tune_cool_offset') | float(1) }}"
          t_boost_error: "{{ states('input_number.climate_manager_tune_boost_error') | float(1.5) }}"
          t_boost_offset: "{{ states('input_number.climate_manager_tune_boost_offset') | float(2) }}"
          t_fan_med: "{{ states('input_number.climate_manager_tune_fan_med') | float(1) }}"
          t_fan_high: "{{ states('input_number.climate_manager_tune_fan_high') | float(2) }}"
      - condition: template
        value_template: "{{ room_raw | is_number }}"
      - variables:
          err: "{{ room_raw | float - target }}"
          cooling: >-
            {{ (was_cooling and not (err <= t_stop or err + t_horizon * slope <= t_forecast_stop))
               or (not was_cooling and err >= t_start) }}
          want_fan: >-
            {{ 'low' if not cooling else
               ('high' if err >= t_fan_high else ('med' if err >= t_fan_med else 'low')) }}
          want_setpoint: >-
            {{ 28 if not cooling else
               [[(target - (t_boost_offset if err >= t_boost_error else t_cool_offset)) | round(0, 'floor') | int, 17] | max, 28] | min }}
      # Parked: the AC was powered off by auto-off below.
      - if:
          - condition: state
            entity_id: input_boolean.climate_manager_parked
            state: "on"
        then:
          - if:
              - condition: state
                entity_id: input_boolean.bedroom_ac_on
                state: "off"
            then:
              - condition: template
                value_template: "{{ err >= t_start }}"
              - service: logbook.log
                data:
                  name: Comfort Thermostat
                  message: >-
                    resumed: {{ states('input_select.climate_manager_room') }}
                    {{ room_raw }} °C, target {{ target }} (e {{ err | round(2) }})
                  entity_id: input_boolean.climate_manager_parked
              - service: script.bedroom_ac_power_toggle
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.climate_manager_parked
      - if:
          - condition: template
            value_template: "{{ cooling != was_cooling }}"
        then:
          - service: "input_boolean.turn_{{ 'on' if cooling else 'off' }}"
            target:
              entity_id: input_boolean.climate_manager_cooling
      - if:
          - condition: template
            value_template: "{{ not is_state('input_select.bedroom_ac_mode', 'cool') }}"
        then:
          - service: input_select.select_option
            target:
              entity_id: input_select.bedroom_ac_mode
            data:
              option: cool
      - if:
          - condition: template
            value_template: "{{ states('input_select.bedroom_ac_fan') != want_fan }}"
        then:
          - service: input_select.select_option
            target:
              entity_id: input_select.bedroom_ac_fan
            data:
              option: "{{ want_fan }}"
      - if:
          - condition: template
            value_template: "{{ want_setpoint | int != setpoint }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.bedroom_ac_temp
            data:
              value: "{{ want_setpoint | int }}"
      # Auto-off: idle long enough and still below target means the house is
      # cool on its own; the idle fan would only make it colder.
      - if:
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.climate_manager_auto_off', 'on')
                 and not cooling and not was_cooling
                 and err <= states('input_number.climate_manager_park_error') | float(-0.5)
                 and (now() - states.input_boolean.climate_manager_cooling.last_changed).total_seconds()
                     >= 60 * states('input_number.climate_manager_park_minutes') | float(30) }}
        then:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.climate_manager_parked
          - service: logbook.log
            data:
              name: Comfort Thermostat
              message: >-
                parked (AC off): {{ states('input_select.climate_manager_room') }}
                {{ room_raw }} °C, target {{ target }} (e {{ err | round(2) }})
              entity_id: input_boolean.climate_manager_parked
          - service: script.bedroom_ac_power_toggle

  - alias: Comfort Thermostat — auto room by time of day
    id: climate_manager_auto_room
    mode: single
    trigger:
      - platform: time
        at: "22:00:00"
        id: night
      - platform: time
        at: "09:00:00"
        id: day
    condition:
      - condition: state
        entity_id: input_boolean.climate_manager_auto_room
        state: "on"
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.climate_manager_room
        data:
          option: "{{ 'Bedroom' if trigger.id == 'night' else 'Living Room' }}"
